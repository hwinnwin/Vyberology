name: CI (Build + Test + Gates)

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Use workspace pnpm version
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

  lint-typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Use workspace pnpm version
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter ./apps/web run lint
      - name: Typecheck
        run: pnpm --filter ./apps/web run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Use workspace pnpm version
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        run: pnpm --filter ./apps/web run test:coverage
      # Coverage enforcement is handled by vitest.config.ts thresholds
      # (80% lines, 80% functions, 70% branches, 80% statements)
      # vitest will fail the run if thresholds are not met.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage

  e2e:
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Use workspace pnpm version
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Build analytics adapter
        run: pnpm --filter @vybe/analytics-adapter run build
      - name: Install Playwright browsers
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter ./apps/web run build
      - name: Run e2e tests
        run: pnpm --filter ./apps/web exec playwright test
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/web/test-results/
