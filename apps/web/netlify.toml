# Netlify Configuration for Vyberology
# This file should be at the root of the monorepo for proper deployment

[build]
  # Base directory relative to repo root
  base = "apps/web"
  # Build command for monorepo
  command = "cd ../.. && npm run build --workspace apps/web"
  # Publish directory relative to base
  publish = "dist"

[build.environment]
  # Production environment variables
  VITE_APP_ENV = "production"
  VITE_FEATURE_OCR = "on"
  VITE_FEATURE_PM_SENTRY = "on"
  # Supabase credentials - UPDATED 2025-11-11
  VITE_SUPABASE_URL = "https://rcrwkarmlckyapqhdmxn.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcndrYXJtbGNreWFwcWhkbXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3MDc1NjQsImV4cCI6MjA3ODI4MzU2NH0.AgrXW5KFkvgujXVHme3zaXpABZyDnWyCTE0bbotXVvU"
  VITE_SUPABASE_PROJECT_ID = "rcrwkarmlckyapqhdmxn"
  # Stripe Live Keys - ADDED 2025-11-11
