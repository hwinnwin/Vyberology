# Netlify Configuration for Vyberology Web App
# Root level configuration for monorepo deployment

[build]
  # Keys are set in Netlify UI → Site settings → Environment variables
  # Required: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_STRIPE_PUBLISHABLE_KEY
  command = "npm install --legacy-peer-deps && npx turbo run build --filter=vite_react_shadcn_ts..."
  publish = "apps/web/dist"
  # Ignore builds if no changes in these paths
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/web packages/"

# Environment variables (also set these in Netlify UI for security)
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_APP_ENV = "production"
  VITE_V4_ENABLED = "false"
  VITE_FEATURE_OCR = "on"
  VITE_FEATURE_PM_SENTRY = "on"
  VITE_SUPABASE_URL = "https://rcrwkarmlckyapqhdmxn.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcndrYXJtbGNreWFwcWhkbXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3MDc1NjQsImV4cCI6MjA3ODI4MzU2NH0.AgrXW5KFkvgujXVHme3zaXpABZyDnWyCTE0bbotXVvU"
  VITE_SUPABASE_PROJECT_ID = "rcrwkarmlckyapqhdmxn"
  VITE_STRIPE_PUBLISHABLE_KEY = "pk_live_51SGaypKQHOT2DNgNdJJ0nZNP2zL7iK3Gb4D3ai4L6poMV6CD0mRSvNIfDpdbA3nXhgP0avW4jPlOsUXZKkuBy50s00unH0hCzd"
  VITE_LUMYN_PRO_PRICE_ID = "price_1TDCy4KQHOT2DNgNv5aINeKq"

# Redirect subdomain to primary vyberology.com domain
[[redirects]]
  from = "https://vyberology.thevybe.global/*"
  to = "https://vyberology.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vyberology.thevybe.global/*"
  to = "https://vyberology.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vyberology.com/*"
  to = "https://vyberology.com/:splat"
  status = 301
  force = true

# Redirect store and online domains when configured
[[redirects]]
  from = "https://vyberology.store/*"
  to = "https://vyberology.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://vyberology.online/*"
  to = "https://vyberology.com/:splat"
  status = 301
  force = true

# SPA fallback - all routes should serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.sentry.io https://*.posthog.com https://*.google-analytics.com https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://js.stripe.com https://hooks.stripe.com https://accounts.google.com; form-action 'self' https://*.supabase.co https://accounts.google.com;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached by CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
